<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>연구 — 혼종의 정면</title>
<meta name="description" content="생산의 지리, 재료의 경로, 제작자의 증언을 세 장의 도판으로 읽는 혼종의 정면 연구 아카이브.">
<link rel="stylesheet" href="style.css?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="polaroids.css?v=37">
<link rel="stylesheet" href="research-page.css?v=7">
<script src="research-points.js?v=1" defer></script>
<script src="research-page.js?v=6" defer></script>
</head>
<body>
<svg class="icon-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <symbol id="ic-home" viewBox="0 0 24 24"><path d="m4 11 8-7 8 7v9H4z"/><path d="M9 20v-7h6v7"/></symbol>
  <symbol id="ic-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="19" cy="7" r="1.5" fill="currentColor" stroke="none"/></symbol>
  <symbol id="ic-left" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
  <symbol id="ic-right" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
  <symbol id="ic-close" viewBox="0 0 24 24"><path d="M5 5 19 19M19 5 5 19"/></symbol>
</svg>
<main class="photo-main research-main">
  <div class="research-window" id="research-window" tabindex="0" aria-label="연구 도판 세 장. 좌우 이동하여 탐색합니다.">
    <div class="research-rail" id="research-rail">
      <section class="research-panel research-panel-map" aria-label="첫 번째 도판, 공장 분포">
        <div class="research-map-layout">
          <div class="research-map-area">
            <div class="research-map-art" id="research-map-art" aria-live="polite"></div>
          </div>
          <header class="research-map-intro">
            <h1 class="research-serif research-map-heading" id="research-map-heading">혼종은<br>어디에서 왔을까?</h1>
            <div class="research-map-selector">
              <div class="research-keymap" aria-label="재료별 공장 분포">
                <div class="research-map-controls" id="research-map-controls" role="group" aria-label="벽돌, 주물, 기와 공장 선택"></div>
                <div class="research-map-year-controls" id="research-map-year-controls" role="group" aria-label="연도 선택"></div>
                <div class="research-keymap-head">
                  <span class="research-keymap-symbols" aria-label="지도 기호"><span>○ 1991년 조사</span><span>＋ 2026년 확인</span></span>
                  <button type="button" class="research-keymap-all" id="research-map-all">전체 보기</button>
                </div>
              </div>
            </div>
            <p class="research-map-annotation" id="research-map-annotation" aria-live="polite"></p>
            <section class="research-factory-panel" id="research-factory-panel" hidden aria-live="polite"></section>
            <div class="research-map-actions" aria-label="지도 자료 기능">
              <button type="button" id="research-factory-edit-toggle" class="research-map-action">업체 위치 입력</button>
              <button type="button" id="research-factory-export" class="research-map-action" hidden>JSON 내보내기</button>
              <button type="button" id="research-map-zoom" class="research-map-action">지도 확대</button>
            </div>
          </header>
        </div>
      </section>
      <section class="research-panel research-panel-production" aria-label="두 번째 도판, 생산과 유통">
        <div class="research-section-head">
          <span class="research-kicker" id="research-production-kicker">02 / PRODUCTION</span>
          <h2 class="research-serif" id="research-production-title">생산에서 정면까지.</h2>
          <p id="research-production-lead"></p>
        </div>
        <div class="research-process" id="research-process" aria-label="재료의 생산과 유통 경로"></div>
        <p class="research-section-footnote" id="research-production-footnote"></p>
      </section>
      <section class="research-panel research-panel-testimony" aria-label="세 번째 도판, 제작자의 증언">
        <div class="research-section-head">
          <span class="research-kicker" id="research-voices-kicker">03 / TESTIMONY</span>
          <h2 class="research-serif" id="research-voices-title">만드는 사람에게 듣다.</h2>
          <p id="research-voices-lead"></p>
        </div>
        <div class="research-voices" id="research-voices" aria-label="재료별 질문과 발언"></div>
        <div class="research-voice-tabs" id="research-voice-tabs" aria-label="모바일 인터뷰 선택"></div>
      </section>
    </div>
  </div>
  <footer class="archive-taskbar research-taskbar" aria-label="연구 아카이브 도구 모음">
    <div class="photo-navigation">
      <a class="icon-button nav-home" href="index.html" title="홈으로" aria-label="혼종의 정면 홈으로"><svg class="ui-icon" viewBox="0 0 24 24"><use href="#ic-home"></use></svg></a>
      <button type="button" class="icon-button" id="chapter-open" title="목차 열기" aria-label="목차 열기" aria-haspopup="dialog" aria-controls="chapter-menu"><svg class="ui-icon" viewBox="0 0 24 24"><use href="#ic-menu"></use></svg></button>
    </div>
    <div class="photo-toolbar research-toolbar" role="group" aria-label="연구 도판 이동">
      <button type="button" class="icon-button" id="research-prev" aria-label="이전 도판" title="이전 도판"><svg class="ui-icon" viewBox="0 0 24 24"><use href="#ic-left"></use></svg></button>
      <span class="research-page-counter" id="research-counter" aria-live="polite">01 / 03</span>
      <button type="button" class="icon-button" id="research-next" aria-label="다음 도판" title="다음 도판"><svg class="ui-icon" viewBox="0 0 24 24"><use href="#ic-right"></use></svg></button>
    </div>
    <nav class="research-page-links" aria-label="연구 도판 바로 가기">
      <button type="button" class="research-page-link is-active" data-page="0" aria-current="page">01 <span>지도</span></button>
      <button type="button" class="research-page-link" data-page="1">02 <span>과정</span></button>
      <button type="button" class="research-page-link" data-page="2">03 <span>증언</span></button>
    </nav>
  </footer>
</main>

<dialog id="research-detail" class="research-detail" aria-label="자료 자세히 보기">
  <button type="button" id="research-detail-close" class="research-detail-close" aria-label="닫기"><svg class="ui-icon" viewBox="0 0 24 24"><use href="#ic-close"></use></svg></button>
  <div class="research-detail-inner">
    <div class="research-detail-image" id="research-detail-image"></div>
    <div class="research-detail-copy">
      <span class="research-kicker" id="research-detail-kicker"></span>
      <h2 id="research-detail-title"></h2>
      <p id="research-detail-description"></p>
    </div>
  </div>
</dialog>


<dialog id="research-factory-editor" class="research-factory-editor" aria-labelledby="research-factory-editor-title">
  <form id="research-factory-form" class="research-factory-form">
    <div class="research-factory-editor-head">
      <h2 id="research-factory-editor-title">업체 위치 기록</h2>
      <button type="button" id="research-factory-cancel" aria-label="닫기">×</button>
    </div>
    <p class="research-factory-hint">지도에서 선택한 기호의 위치와 업체 정보를 연결합니다.</p>
    <label>업체명 <input id="research-factory-name" name="name" type="text" required maxlength="130" autocomplete="off" placeholder="업체명 입력"></label>
    <div class="research-factory-form-pair">
      <label>재료 <select id="research-factory-material" name="material"><option value="brick">벽돌</option><option value="cast">주물</option><option value="tile">기와</option></select></label>
      <label>연도 <select id="research-factory-year" name="year"><option value="1991">1991</option><option value="2026">2026</option></select></label>
    </div>
    <label>지역 <input id="research-factory-region" name="region" type="text" maxlength="140" placeholder="예: 서울특별시"></label>
    <label>참고·메모 <textarea id="research-factory-note" name="note" rows="2" maxlength="600" placeholder="생산품목, 이전 여부 등"></textarea></label>
    <label>자료 출처 <input id="research-factory-source" name="source" type="text" maxlength="250" placeholder="조사표, 인터뷰 등"></label>
    <p id="research-factory-coordinate" class="research-factory-coordinate"></p>
    <div class="research-factory-form-actions">
      <button type="button" id="research-factory-delete" class="research-factory-delete" hidden>삭제</button>
      <button type="submit" class="research-factory-save">저장</button>
    </div>
  </form>
</dialog>

<dialog id="chapter-menu" class="chapter-menu" aria-labelledby="chapter-title">
  <div class="chapter-top"><span class="dialog-kicker">HETERO FRONT / INDEX</span><button type="button" class="icon-button" id="chapter-close" aria-label="목차 닫기"><svg class="ui-icon" viewBox="0 0 24 24"><use href="#ic-close"></use></svg></button></div>
  <h2 id="chapter-title">혼종의 정면<span class="chapter-asterisk">✳</span></h2>
  <nav class="chapter-list" aria-label="챕터 목차">
    <a href="index.html"><span>00</span><strong>INTRO</strong><span>소개</span></a>
    <a href="landscapes.html"><span>01</span><strong>LANDSCAPES</strong><span>풍경</span></a>
    <a href="materials.html"><span>02</span><strong>MATERIALS</strong><span>재료</span></a>
    <a href="research.html" aria-current="page"><span>03</span><strong>RESEARCH</strong><span>연구</span></a>
    <a href="interviews.html"><span>04</span><strong>INTERVIEWS</strong><span>인터뷰</span></a>
    <a href="exhibition.html"><span>05</span><strong>EXHIBITION</strong><span>전시</span></a>
  </nav>
  <p class="chapter-caption">ATELIER 作 · ARCHIVE 2026</p>
</dialog>
</body>
</html>
