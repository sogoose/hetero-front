<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>전시 — 혼종의 정면</title>
<meta name="description" content="2026.11.13–11.29, 아르코미술관 공간열림. 세미나 11월 20일과 22일.">
<link rel="stylesheet" href="style.css?v=4">
<style>
/* Exhibition / editorial page aligned with index.html and who-are-we.html.
   No dl elements: legacy style.css applies a global grid to dl. */
html,body{margin:0!important;width:100%!important;height:100%!important;overflow:hidden!important;background:#fff!important;color:#191a19}
body{font-family:Pretendard,-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased}
*,*::before,*::after{box-sizing:border-box}
.event-page{position:relative;width:100%;height:100vh;height:100dvh;overflow:hidden;background:#fff;isolation:isolate}
.event-masthead{position:absolute;z-index:24;top:clamp(20px,3vh,40px);left:clamp(20px,3vw,55px);right:clamp(20px,3vw,55px);display:flex;align-items:center;justify-content:space-between;gap:15px;pointer-events:none}
.event-masthead a{display:block;pointer-events:auto}
.event-masthead img{display:block;height:45px;width:auto;max-width:none}
.event-main{position:absolute;inset:clamp(94px,12vh,135px) clamp(26px,6.5vw,120px) 70px;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden}
.event-layout{width:min(100%,1100px);height:min(100%,645px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;gap:clamp(52px,7vw,118px);margin:auto}
.event-poster{display:flex;align-items:center;justify-content:center;width:100%;height:100%;min-width:0;margin:0}
.event-poster img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;object-position:center;filter:none}
.event-information{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:clamp(28px,4.3vh,44px);min-width:0;width:100%}
.event-fact{margin:0;max-width:100%;font:770 clamp(23px,2.1vw,30px)/1.55 Pretendard,-apple-system,sans-serif;letter-spacing:-.064em;color:#000;word-break:keep-all}
.event-dates{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 .3em}
.event-dates time{white-space:nowrap}
.event-dates .event-separator{font-weight:500;color:#000;white-space:nowrap}
.event-place{font-weight:770}
.event-seminars{display:flex;flex-direction:column;align-items:flex-start;gap:12px;margin-top:clamp(18px,4vh,36px);color:#000}
.event-seminars p{margin:0;font:500 clamp(11px,.85vw,13px)/1.7 Pretendard,-apple-system,sans-serif;letter-spacing:-.01em;white-space:normal;word-break:keep-all;color:#000}
.event-seminars time,.event-seminar-kind{font-weight:740;color:#000}.event-seminars time{white-space:nowrap}
.event-footer{position:fixed!important;z-index:50;bottom:0;left:0;right:0;height:70px;min-height:70px;display:flex!important;align-items:center!important;justify-content:flex-start!important;flex-wrap:nowrap!important;gap:20px;padding:0 clamp(14px,2.6vw,42px)!important;background:#fff;border-top:1px solid rgba(62,60,50,.08);color:#77776f}
.event-footer-left{display:flex;align-items:center;gap:13px;flex:0 0 auto}
.event-icon-button{display:grid;place-items:center;flex:0 0 36px;width:36px;height:36px;min-height:0;border:0;border-radius:0;box-shadow:none;padding:0;background:none;color:#77776f;text-decoration:none;cursor:pointer}
.event-icon-button:hover{color:#282823;background:none}
.event-ui-icon{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round}
.event-masthead a:focus-visible,.event-footer a:focus-visible,.event-footer button:focus-visible{outline:2px solid #0033ff;outline-offset:3px}
.event-menu-dialog{position:fixed;inset:auto auto 78px clamp(14px,2.6vw,42px);width:min(320px,calc(100vw - 32px));max-height:min(80vh,540px);overflow:auto;margin:0;padding:20px 24px 23px;border:1px solid #dadad6;border-radius:0;background:#fff;color:#282823;box-shadow:0 14px 50px rgba(10,10,10,.1)}
.event-menu-dialog::backdrop{background:rgba(255,255,255,.18)}
.event-menu-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.event-menu-header small{font:500 10px/1.3 Pretendard,sans-serif;letter-spacing:.12em;color:#888}
.event-menu-close{border:0;background:none;font:300 24px/1 Pretendard,sans-serif;cursor:pointer}
.event-chapter-links{display:flex;flex-direction:column;gap:0}
.event-chapter-links a{display:flex;align-items:baseline;gap:13px;border-bottom:1px solid #ecece9;padding:11px 0;font:500 13px/1.5 Pretendard,sans-serif;text-decoration:none}
.event-chapter-links a span{font:400 10px/1 monospace;color:#a4a39e}
.event-chapter-links a[aria-current=page],.event-chapter-links a:hover{color:#0033ff}
@media(max-width:900px) and (min-width:601px){
 .event-layout{gap:clamp(30px,4.4vw,58px);height:min(100%,580px)}
 .event-fact{font-size:clamp(19px,2.7vw,25px)}
}
@media(max-width:800px){
 .event-masthead{top:16px;left:18px;right:18px}
}
@media(max-width:600px){
 html,body{height:auto!important;min-height:100%!important;overflow-x:hidden!important;overflow-y:auto!important}
 .event-page{height:auto;min-height:100svh;overflow:visible;padding-bottom:67px}
 .event-masthead{top:13px;left:12px;right:12px;gap:7px}
 .event-masthead img{height:45px}
 .event-main{position:relative;inset:auto;display:block;overflow:visible;padding:clamp(115px,17vh,155px) 24px 50px}
 .event-layout{width:min(100%,490px);height:auto;display:flex;flex-direction:column;gap:45px}
 .event-poster{height:auto;max-height:none}
 .event-poster img{width:auto;max-width:100%;max-height:45vh;height:auto}
 .event-information{align-self:stretch;gap:25px}
 .event-fact{font-size:clamp(22px,5.5vw,28px)}
 .event-seminars{margin-top:22px;gap:12px}
 .event-seminars p{font-size:12px}
 .event-footer{height:67px;min-height:67px;padding:0 12px!important;gap:6px}
 .event-footer-left{gap:2px}
 .event-icon-button{width:30px;height:36px;flex-basis:30px}
 .event-ui-icon{width:15px;height:15px}
 .event-menu-dialog{bottom:75px}
}
@media(max-height:650px) and (min-width:601px){
 .event-layout{height:100%}
 .event-fact{font-size:clamp(20px,2vw,27px)}
 .event-information{gap:20px}
 .event-seminars{margin-top:13px}
}
</style>

<body>
<main class="event-page">
  <header class="event-masthead" aria-label="전시 로고">
    <a href="index.html" aria-label="혼종의 정면 홈으로"><img src="assets/home/logo-title-compact.svg" alt="혼종의 정면" draggable="false"></a>
    <a href="https://arko.or.kr/artcenter/board/view/503?page=2&amp;cid=717126" target="_blank" rel="noopener noreferrer" aria-label="2026 아르코 건축예술랩 공식 안내"><img src="assets/home/logo-program-compact.svg" alt="2026 아르코 건축예술랩" draggable="false"></a>
  </header>

  <section class="event-main" aria-label="전시 기간, 장소 및 세미나">
    <div class="event-layout">
      <figure class="event-poster">
        <img src="assets/poster.jpg" alt="혼종의 정면 전시 포스터" loading="eager" decoding="async">
      </figure>
      <div class="event-information">
        <p class="event-fact event-dates" aria-label="2026년 11월 13일부터 11월 29일까지">
          <time datetime="2026-11-13">2026. 11. 13</time><span class="event-separator">—</span><time datetime="2026-11-29">11. 29</time>
        </p>
        <p class="event-fact event-place">아르코미술관 공간열림</p>
        <div class="event-seminars" aria-label="연계 세미나 두 건">
          <p><time datetime="2026-11-20T20:00">11. 20 (금) 20:00</time> · <strong class="event-seminar-kind">학생 세미나</strong> · 아틀리에 作 작업실</p>
          <p><time datetime="2026-11-22T15:00">11. 22 (일) 15:00</time> · <strong class="event-seminar-kind">일반인 세미나</strong> · 아르코미술관 3층 세미나실</p>
        </div>
      </div>
    </div>
  </section>

  <footer class="event-footer" aria-label="사이트 탐색">
    <div class="event-footer-left">
      <a href="index.html" class="event-icon-button" title="홈으로" aria-label="홈으로"><svg class="event-ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m4 11 8-7 8 7v9H4zM9 20v-7h6v7"/></svg></a>
      <button type="button" class="event-icon-button" id="event-menu-open" title="목차 열기" aria-label="목차 열기" aria-haspopup="dialog" aria-controls="event-menu-dialog"><svg class="event-ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="19" cy="7" r="1.5" fill="currentColor" stroke="none"/></svg></button>
    </div>
  </footer>
  <dialog id="event-menu-dialog" class="event-menu-dialog" aria-label="사이트 목차">
    <div class="event-menu-header"><small>HETERO FRONT / INDEX</small><button type="button" class="event-menu-close" id="event-menu-close" aria-label="목차 닫기">×</button></div>
    <nav class="event-chapter-links" aria-label="전체 페이지">
      <a href="index.html"><span>00</span> INTRO / 소개</a>
      <a href="landscapes.html"><span>01</span> LANDSCAPES / 풍경</a>
      <a href="materials.html"><span>02</span> MATERIALS / 재료</a>
      <a href="research.html"><span>03</span> RESEARCH / 연구</a>
      <a href="interviews.html"><span>04</span> INTERVIEWS / 인터뷰</a>
      <a href="exhibition.html" aria-current="page"><span>05</span> EXHIBITION / 전시</a>
      <a href="who-are-we.html"><span>+</span> ATELIER 作 / 팀 소개</a>
    </nav>
  </dialog>
</main>
<script>
(() => {
 const dialog=document.getElementById('event-menu-dialog');
 document.getElementById('event-menu-open')?.addEventListener('click',()=>dialog?.showModal());
 document.getElementById('event-menu-close')?.addEventListener('click',()=>dialog?.close());
 dialog?.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});
})();
</script>
</body>
