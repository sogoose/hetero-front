<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우리가 알고 있다고 생각했던 것들 — 혼종의 정면</title><meta name="description" content="익숙한 건물과 재료의 풍경을 펼쳐 보는 사진 아카이브."><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="polaroids.css?v=5"><script src="polaroids.js?v=5" defer></script></head><body><main class="photo-main"><h1 class="sr-only">풍경 사진 아카이브</h1><div class="photo-toolbar"><a class="photo-back" href="index.html" aria-label="혼종의 정면 메인으로">돌아가기</a><div class="view-switch" role="group" aria-label="사진 배치"><button id="scatter" aria-pressed="true">흩어 보기</button><button id="align" aria-pressed="false">정렬하기</button></div><button id="shuffle">다른 사진</button><span class="sr-only" id="photo-count" aria-live="polite"></span></div><p class="sr-only" id="photo-status" role="status">사진을 펼치는 중입니다.</p><section id="photo-board" class="photo-board" aria-label="건물과 재료 사진" aria-description="마우스로 가까이 가면 사진이 밀립니다. 사진을 드래그해 놓거나 휠로 뒤섞을 수 있습니다. 클릭하면 확대합니다."></section><div class="photo-pagination" hidden><button id="previous">← 이전</button><span id="page-number" aria-live="polite"></span><button id="next">다음 →</button></div></main><dialog id="photo-detail" aria-labelledby="detail-title"><h2 id="detail-title" class="sr-only"></h2><div class="focus-stage"><div class="focus-lift"><div class="focus-card"><button class="focus-face focus-front" id="detail-front" aria-label="폴라로이드를 뒤집어 정보 보기"><span class="focus-image"><img id="detail-image" alt=""></span><span id="detail-caption"></span></button><article class="focus-face focus-back" id="detail-back" aria-hidden="true" inert><div class="back-stamp">HETERO FRONT<br>FIELD ARCHIVE · <span id="detail-number"></span></div><h3 id="detail-back-title"></h3><dl id="detail-fields"></dl><p id="detail-description"></p><small id="detail-credit"></small><span class="back-rule"></span></article></div></div></div><div class="focus-controls"><button id="detail-flip" aria-pressed="false">뒷면 보기</button><button id="detail-close">내려놓기</button></div></dialog></body></html>
