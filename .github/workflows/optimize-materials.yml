name: Optimize material cutouts
on:
  push:
    paths:
      - '.github/workflows/optimize-materials.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image encoder
        run: python -m pip install Pillow
      - name: Make lightweight WebP display assets
        run: python scripts/optimize_materials.py
      - name: Commit optimized materials
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/materials/stickers.json assets/materials/optimized/
          if git diff --cached --quiet; then
            echo "No material optimizations needed."
            exit 0
          fi
          git commit -m "Optimize cutout PNGs into lightweight transparent WebP display assets"
          git push
