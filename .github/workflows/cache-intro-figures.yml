name: Cache exhibition reference figures

on:
  push:
    paths:
      - '.github/workflows/cache-intro-figures.yml'
      - 'scripts/cache_intro_figures.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exhibition archive
        uses: actions/checkout@v4
      - name: Install image processing dependencies
        run: python3 -m pip install Pillow
      - name: Cache the four attributed picture references
        run: python3 scripts/cache_intro_figures.py
      - name: Commit reference assets without touching original archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/intro/
          if git diff --cached --quiet; then
            echo "Reference images already cached."
          else
            git commit -m "Add optimized exhibition reference plates"
            git push
          fi
      - name: Request fresh lightweight Pages deployment
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method POST "repos/${{ github.repository }}/actions/workflows/publish-lightweight-pages.yml/dispatches" -f ref=main
