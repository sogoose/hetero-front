</head>
<body>
<svg class="icon-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
 <symbol id="ic-home" viewBox="0 0 24 24"><path d="m4 11 8-7 8 7v9H4z"/><path d="M9 20v-7h6v7"/></symbol>
 <symbol id="ic-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="19" cy="7" r="1.5" fill="currentColor" stroke="none"/></symbol>
 <symbol id="ic-left" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
 <symbol id="ic-right" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
 <symbol id="ic-close" viewBox="0 0 24 24"><path d="M5 5 19 19M19 5 5 19"/></symbol>
</svg>
<main class="photo-main interview-main">
  <div class="interview-viewport" id="interview-viewport" tabindex="0" role="region" aria-label="기와, 주물, 벽돌 인터뷰. 아래로 스크롤하여 읽기">
    <div class="interview-rail" id="interview-rail">
      <p class="interview-loading" id="interview-loading">인터뷰를 불러오는 중…</p>
    </div>
  </div>
  <footer class="archive-taskbar interview-taskbar" aria-label="인터뷰 아카이브 탐색">
    <div class="photo-navigation interview-nav-start">
      <a href="index.html" class="icon-button nav-home" title="홈으로" aria-label="홈으로"><svg class="ui-icon" viewBox="0 0 24 24"><use href="#ic-home"></use></svg></a>
      <button type="button" class="icon-button" id="interview-chapter-open" title="목차" aria-label="목차 열기"><svg class="ui-icon" viewBox="0 0 24 24"><use href="#ic-menu"></use></svg></button>
    </div>
    <div class="interview-center-controls">
      <button type="button" class="icon-button" id="interview-previous" title="이전 인터뷰" aria-label="이전 인터뷰로 이동"><svg class="ui-icon" viewBox="0 0 24 24"><use href="#ic-left"></use></svg></button>
      <nav class="interview-section-nav" id="interview-section-nav" aria-label="인터뷰 선택">
        <button type="button" data-interview-id="goryeong" class="is-current">기와</button>
        <button type="button" data-interview-id="jungwoo">주물</button>
        <button type="button" data-interview-id="chunghwa">벽돌</button>
      </nav>
      <button type="button" class="icon-button" id="interview-next" title="다음 인터뷰" aria-label="다음 인터뷰로 이동"><svg class="ui-icon" viewBox="0 0 24 24"><use href="#ic-right"></use></svg></button>
    </div>
    <div class="interview-end-controls">
      <input type="range" id="interview-progress" aria-label="세로 읽기 위치" min="0" max="1000" value="0" step="1">
      <output id="interview-position" aria-live="off">01 / 03</output>
    </div>
  </footer>
</main>

<dialog id="interview-upload-dialog" class="interview-upload-dialog" aria-labelledby="interview-upload-dialog-title">
  <div class="interview-upload-head">
    <h2 id="interview-upload-dialog-title">사진 추가</h2>
    <button id="interview-upload-close" class="interview-upload-close" type="button" aria-label="닫기">×</button>
  </div>
  <p class="interview-upload-lead" id="interview-upload-title"></p>
  <form id="interview-upload-form" class="interview-upload-fields">
    <label>사진 선택<input id="interview-upload-file" type="file" accept="image/jpeg,image/png,image/webp,image/avif" required></label>
    <img id="interview-upload-preview" class="interview-upload-preview" alt="선택한 사진 미리보기" hidden>
    <label>사진 설명 <span>(선택)</span><input id="interview-upload-alt" type="text" maxlength="180" placeholder="사진에 무엇이 보이나요?"></label>
    <label>사진 주석 <span>(선택)</span><textarea id="interview-upload-caption" rows="2" maxlength="300" placeholder="촬영 장소, 날짜 또는 설명"></textarea></label>
    <p class="interview-upload-hint">로그인 없이 사진을 추가할 수 있어요. 사진은 자동 압축되며 다른 방문자에게도 공개됩니다.</p>
    <button class="interview-upload-primary" type="submit">사진 업로드</button>
  </form>
  <p id="interview-upload-status" class="interview-upload-status" role="status" aria-live="polite"></p>
</dialog>
<dialog id="interview-image-detail" class="interview-image-detail" aria-label="인터뷰 사진 확대">
  <button type="button" id="interview-image-close" class="interview-image-close" aria-label="닫기">×</button>
  <img id="interview-image-large" class="interview-image-large" alt="">
  <p id="interview-image-caption" class="interview-image-caption"></p>
</dialog>

 <div class="chapter-top"><span class="dialog-kicker">HETERO FRONT / INDEX</span><button type="button" class="icon-button" id="chapter-close" aria-label="목차 닫기"><svg class="ui-icon" viewBox="0 0 24 24"><use href="#ic-close"></use></svg></button></div>
