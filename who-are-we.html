<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>아뜰리에 作 — 혼종의 정면</title>
<meta name="description" content="아뜰리에 作은 신촌의 작은 작업실이다. 2019년부터 함께한 네 사람의 건축적 질문.">
<link rel="stylesheet" href="style.css?v=4">
<style>
html,body{margin:0;min-height:100%;background:#fff;color:#171717}
body{font-family:Pretendard,-apple-system,BlinkMacSystemFont,Arial,sans-serif}
.studio-page{box-sizing:border-box;min-height:100svh;padding:clamp(25px,3.1vw,54px) clamp(22px,5.2vw,88px) clamp(85px,11vh,160px)}
.studio-top{display:flex;align-items:center;justify-content:space-between}
.studio-back{font:500 12px/1.5 Pretendard,sans-serif;letter-spacing:-.02em;text-decoration:none;color:#292929;border-bottom:1px solid #999;padding-bottom:5px}
.studio-back:focus-visible{outline:2px solid #0033ff;outline-offset:4px}
.studio-grid{
 display:grid;
 grid-template-columns:minmax(0,.88fr) minmax(0,1.12fr);
 grid-template-areas:"identity intro" "gallery people";
 column-gap:clamp(55px,7.2vw,115px);
 row-gap:clamp(68px,10vh,112px);
 align-items:start;max-width:1080px;margin:0 auto;
 padding-top:clamp(82px,12vh,136px)
}
.studio-identity{grid-area:identity;min-width:0;padding-top:4px}
.studio-logo{display:block;width:min(100%,335px);height:auto}
.studio-intro{grid-area:intro;min-width:0;max-width:515px;font-size:clamp(13px,.95vw,15px);font-weight:410;line-height:1.91;letter-spacing:-.033em;word-break:keep-all;color:#292a27}
.studio-intro p{margin:0 0 25px}
.studio-intro p:last-child{margin-bottom:0}
.studio-gallery{grid-area:gallery;min-width:0;max-width:510px}
.studio-gallery-grid{
 display:grid;grid-template-columns:repeat(6,minmax(0,1fr));
 grid-auto-rows:8px;grid-auto-flow:dense;
 column-gap:clamp(9px,1vw,13px);row-gap:clamp(9px,1vw,13px);
 align-items:start;
}
.studio-gallery-item{margin:0;min-width:0;grid-column:span 2;align-self:start;overflow:visible}
.studio-gallery-item.is-featured{grid-column:span 4}
.studio-gallery-item img{
 display:block;width:100%;height:auto;max-width:100%;
 aspect-ratio:auto;object-fit:contain;object-position:center;
 user-select:none;pointer-events:none
}
.studio-team{grid-area:people;min-width:0;max-width:590px;width:100%}
.studio-people{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(10px,1.8vw,25px);align-items:end}
.studio-person{min-width:0;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.studio-person img{display:block;width:100%;height:clamp(130px,12vw,190px);object-fit:contain;object-position:center bottom;pointer-events:none}
.studio-person figcaption{display:flex;flex-direction:column;gap:3px;align-items:center;text-align:center;margin-top:15px;white-space:nowrap}
.studio-person-name{font:550 clamp(11px,.88vw,13px)/1.45 Pretendard,sans-serif;letter-spacing:-.03em;color:#242424}
.studio-person-role{font:400 10px/1.5 Pretendard,sans-serif;letter-spacing:-.01em;color:#92918c}
@media(max-width:1000px){
 .studio-grid{column-gap:clamp(30px,5vw,65px);grid-template-columns:minmax(0,.88fr) minmax(0,1.12fr)}
 .studio-person img{height:clamp(110px,13vw,155px)}
}
@media(max-width:760px){
 .studio-page{padding:24px 22px 65px}
 .studio-grid{
  grid-template-columns:minmax(0,1fr);
  grid-template-areas:"identity" "intro" "people" "gallery";
  gap:clamp(34px,6vh,55px);padding-top:64px;max-width:590px
 }
 .studio-logo{width:min(85%,355px)}
 .studio-intro{font-size:14px;line-height:1.87;max-width:570px}
 .studio-gallery,.studio-team{max-width:100%}
 .studio-person img{height:clamp(115px,24vw,172px)}
}
@media(max-width:480px){
 .studio-logo{width:min(100%,310px)}
 .studio-grid{padding-top:50px;gap:39px}
 .studio-intro{font-size:13.5px}
 .studio-people{gap:8px}
 .studio-person img{height:clamp(87px,25vw,130px)}
 .studio-person figcaption{margin-top:12px}
 .studio-person-name{font-size:11px}
 .studio-person-role{font-size:9px}
 .studio-gallery-grid{column-gap:8px;row-gap:8px;grid-auto-rows:6px}
}
</style>
</head>
<body>
<main class="studio-page">
  <div class="studio-top"><a class="studio-back" href="index.html">← 처음으로</a></div>
  <div class="studio-grid">
    <header class="studio-identity">
      <img class="studio-logo" src="assets/home/logo-horizontal-team.svg" alt="아뜰리에 作">
    </header>
    <section class="studio-intro" aria-label="아뜰리에 작 소개">
      <p>아뜰리에作은 신촌의 작은 작업실이다. 2019년부터 함께한 4인이 공모전과 건축 토론을 지속하며 형성한 팀으로, 각자는 도시, 건축실무, 국제 건축교육 등 서로 다른 층위에서 건축을 경험해 왔다.</p>
      <p>그 과정에서 각 팀원들은 한국 건축 안에서 이질적인 재료, 방식, 언어들이 아무런 질문 없이 병치되며 혼재와 모순이 당연시되는 현실을 반복적으로 마주했다. 본 프로젝트는 실무의 현장에서 체감된 그 질문을 건축 재료와 생산의 층위에서 다시 마주하려는 시도이다.</p>
    </section>
    <section class="studio-gallery" aria-label="아뜰리에 사진 갤러리">
      <div class="studio-gallery-grid" id="studio-gallery-grid"></div>
    </section>
    <section class="studio-team" aria-label="아뜰리에 작의 네 사람">
      <div class="studio-people">
        <figure class="studio-person"><img src="assets/home/person-02.svg" alt="" draggable="false"><figcaption><span class="studio-person-name">손정호</span><span class="studio-person-role">팀장</span></figcaption></figure>
        <figure class="studio-person"><img src="assets/home/person-01.svg" alt="" draggable="false"><figcaption><span class="studio-person-name">박소현</span><span class="studio-person-role">팀원</span></figcaption></figure>
        <figure class="studio-person"><img src="assets/home/person-03.svg" alt="" draggable="false"><figcaption><span class="studio-person-name">이석주</span><span class="studio-person-role">팀원</span></figcaption></figure>
        <figure class="studio-person"><img src="assets/home/person-04.svg" alt="" draggable="false"><figcaption><span class="studio-person-name">이철원</span><span class="studio-person-role">팀원</span></figcaption></figure>
      </div>
    </section>
  </div>
</main>
<script src="studio-gallery.js?v=2" defer></script>
</body>
</html>
