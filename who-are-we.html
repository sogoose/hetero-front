<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>아뜰리에 作 — 혼종의 정면</title>
<meta name="description" content="아뜰리에 作은 신촌의 작은 작업실이다. 2019년부터 함께한 네 사람의 건축적 질문.">
<link rel="stylesheet" href="style.css?v=4">
<style>
html,body{margin:0;min-height:100%;background:#fff;color:#171717;}
body{font-family:Pretendard,-apple-system,BlinkMacSystemFont,Arial,sans-serif;}
.studio-page{box-sizing:border-box;min-height:100svh;padding:clamp(22px,3vw,52px) clamp(22px,5vw,86px) clamp(45px,7vh,100px)}
.studio-top{display:flex;justify-content:space-between;align-items:center}
.studio-back{font:500 12px/1.5 Pretendard,sans-serif;letter-spacing:-.02em;text-decoration:none;color:#292929;border-bottom:1px solid #999;padding-bottom:5px}
.studio-grid{display:grid;grid-template-columns:minmax(250px,.8fr) minmax(0,1.2fr);gap:clamp(45px,9vw,160px);align-items:start;max-width:1530px;margin:0 auto;padding-top:clamp(80px,13vh,170px)}
.studio-left{min-width:0}
.studio-logo{display:block;width:min(100%,460px);height:auto;max-width:100%}
.studio-members{margin-top:clamp(65px,10vh,145px);font-size:clamp(17px,1.6vw,24px);font-weight:450;letter-spacing:-.045em;line-height:1.5;}
.studio-members p{margin:0 0 18px;display:grid;grid-template-columns:55px 1fr;gap:13px}
.studio-members span{font-size:12px;color:#82827f;letter-spacing:0;margin-top:7px}
.studio-right{min-width:0;padding-top:clamp(15px,3vh,35px)}
.studio-intro{columns:2;column-gap:clamp(28px,3vw,62px);font-size:clamp(14px,1.05vw,17px);font-weight:430;line-height:2;letter-spacing:-.028em;word-break:keep-all;}
.studio-intro p{margin:0 0 21px;break-inside:avoid}
.studio-collage{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(8px,1vw,14px);align-items:center;margin:clamp(55px,9vh,110px) 0 0}
.studio-collage:empty{display:none}
.studio-collage img{display:block;width:100%;height:auto;object-fit:contain;pointer-events:none}
@media(max-width:1050px){.studio-grid{grid-template-columns:minmax(210px,.8fr) minmax(0,1.2fr);gap:45px}.studio-intro{font-size:14px;column-gap:23px}}
@media(max-width:760px){.studio-page{padding:24px 22px 60px}.studio-grid{grid-template-columns:1fr;gap:45px;padding-top:75px}.studio-logo{width:min(80%,380px)}.studio-members{margin-top:42px}.studio-right{padding-top:0}.studio-intro{columns:2;column-gap:24px}.studio-collage{grid-template-columns:repeat(4,minmax(0,1fr));margin-top:55px}}
@media(max-width:480px){.studio-intro{columns:1;font-size:15px}.studio-members{font-size:18px}.studio-logo{width:min(100%,310px)}}
</style>
</head>
<body>
<main class="studio-page">
  <div class="studio-top"><a class="studio-back" href="index.html">← 처음으로</a></div>
  <div class="studio-grid">
    <section class="studio-left" aria-label="아뜰리에 作과 참여자">
      <img class="studio-logo" src="assets/home/logo-horizontal-team.svg" alt="아뜰리에 作">
      <div class="studio-members">
        <p><span>팀장</span><strong>손정호</strong></p>
        <p><span>팀원</span><strong>박소현 · 이석주 · 이철원</strong></p>
      </div>
    </section>
    <section class="studio-right" aria-label="팀 소개">
      <div class="studio-intro">
        <p>아뜰리에作은 신촌의 작은 작업실이다. 2019년부터 함께한 4인이 공모전과 건축 토론을 지속하며 형성한 팀으로, 각자는 도시, 건축실무, 국제 건축교육 등 서로 다른 층위에서 건축을 경험해 왔다.</p>
        <p>그 과정에서 우리는 한국 건축 안에서 이질적인 재료, 방식, 언어들이 아무런 질문 없이 병치되며 혼재와 모순이 당연시되는 현실을 반복적으로 마주했다. 본 프로젝트는 실무의 현장에서 체감된 그 질문을 건축 재료와 생산의 층위에서 다시 마주하려는 시도이다.</p>
      </div>
      <div class="studio-collage" aria-label="아뜰리에 작업 이미지"></div>
    </section>
  </div>
</main>
</body>
</html>
